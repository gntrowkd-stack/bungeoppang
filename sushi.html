*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;background:#251e18;color:#f8e9cd;font:13px system-ui;overscroll-behavior:none}body{height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}header{text-align:center;padding:12px;background:linear-gradient(90deg,#582a22,#a34a35,#582a22);border-bottom:3px solid #d0a16a}header b{font: bold 28px serif;letter-spacing:5px}header small{display:block;letter-spacing:3px;color:#f5d5a6;font-size:10px}main{width:100%;max-width:640px;margin:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px}button{background:linear-gradient(#554537,#372c23);color:#f8e9cd;border:1px solid #967453;border-radius:5px;font:inherit;min-height:36px;padding:5px}button.active{background:#a16a3c;border-color:#f4d29b}button:disabled{opacity:.45}#bar{display:flex;align-items:center;justify-content:space-between;gap:8px}#customer{display:grid;grid-template-columns:1fr 1fr;gap:6px}#customer[hidden]{display:none}.guest{display:flex;align-items:center;gap:5px}#face{width:49px;height:58px;image-rendering:pixelated}.bubble{background:#fff0d2;color:#523524;padding:6px;border-radius:6px;flex:1;font-size:11px}.bubble b{display:block;margin-bottom:3px}.ticket{background:#f7e8c9;color:#513b27;padding:5px 8px;border-bottom:2px dashed #a88e68;font-size:11px}.ticket b{letter-spacing:2px}.ticket div{margin-top:3px}.ok{color:#397145}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tools button{min-height:45px;font-size:11px}.tools span{display:block;font-size:18px}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#board{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:600/420;touch-action:none;border-radius:8px;box-shadow:0 6px 22px #0007}.actions{display:flex;gap:5px}.actions button{flex:1}#msg{text-align:center;color:#e6c692;min-height:25px;font-size:12px}#gate{position:fixed;inset:0;z-index:10;background:#211a15f5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}#gate[hidden]{display:none}#gate b{font: bold 36px serif;letter-spacing:5px}#gate button{padding:12px 34px}#stamp{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);font:bold 44px serif;color:#fff1ba;text-shadow:0 3px 12px #572b17;pointer-events:none;opacity:0;white-space:nowrap}#stamp.show{animation:fade 2s both}@keyframes fade{0%{opacity:0}15%,55%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%)}}.arrive{animation:arrive .4s both}@keyframes arrive{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}@media(max-height:600px){header{padding:4px}header b{font-size:20px}.tools button{min-height:30px}.tools span{font-size:13px}}
</style></head><body><div id="gate"><b>夜のすし屋</b><div>寿司 · 작은 골목의 스시야</div><button id="start">暖簾をくぐる · 시작하기</button></div><header><b>夜のすし屋</b><small>江戸前寿司 · いらっしゃいませ</small></header><main><div id="bar"><button id="mode">営業開始 · 장사 시작</button><span id="sales">自由調理 · 자유 조리</span></div><div id="customer" hidden><div class="guest"><canvas id="face" width="48" height="56"></canvas><div class="bubble"><b id="speech"></b><span id="orderName"></span></div></div><div class="ticket"><b>注文票</b><div id="check"></div></div></div><div class="tools" id="tools"></div><div class="stage"><canvas id="board" width="600" height="420"></canvas></div><div id="msg">밥을 선택하고 접시의 자리를 눌러 초밥을 쥐어주세요.</div><div class="actions"><button id="undo">한 알 빼기</button><button id="clear">새 접시</button><button id="serve">완성</button></div></main><div id="stamp"></div><script>
(()=>{const $=s=>document.querySelector(s),cv=$('#board'),g=cv.getContext('2d');const tools=[['rice','🍚','샤리'],['wasabi','🌿','와사비'],['tuna','🐟','참치'],['salmon','🟠','연어'],['ebi','🦐','새우'],['egg','🥚','계란'],['squid','🦑','오징어'],['nori','◼','김 띠'],['soy','🍶','간장'],['ginger','🌸','초생강'],['ikura','🔴','연어알'],['cucumber','🥒','오이']];let tool='rice',slots=Array.from({length:8},()=>null),shop=false,order=null,served=0,sales=0,locked=false,timer,press=null,ginger=0,soy=false;const pos=Array.from({length:8},(_,i)=>({x:99+(i%4)*134,y:136+Math.floor(i/4)*140}));const label=Object.fromEntries(tools.map(x=>[x[0],x[2]]));const menus=[{name:'まぐろ',items:['tuna','tuna','tuna','tuna'],price:800},{name:'サーモン盛り',items:['salmon','salmon','salmon','salmon'],price:850},{name:'おまかせ',items:['tuna','salmon','ebi','egg','squid','ikura'],price:1300},{name:'わさび抜き',items:['ebi','ebi','egg','egg'],price:750,noWasabi:true},{name:'特上盛り',items:['tuna','tuna','salmon','salmon','ebi','squid','ikura','egg'],price:1800}];function say(t){$('#msg').textContent=t}function grad(x,y,X,Y,a){let z=g.createLinearGradient(x,y,X,Y);a.forEach(([i,c])=>z.addColorStop(i,c));return z}function oval(x,y,a,b,c){g.beginPath();g.ellipse(x,y,a,b,0,0,6.283);g.fillStyle=c;g.fill()}function round(x,y,w,h,r,c){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill()}function rand(i){let n=Math.sin(i*127.1)*43758.5453;return n-Math.floor(n)}function sushi(x,y,f,i){oval(x+3,y+21,48,16,'#1a100d55');round(x-44,y-25,88,54,22,grad(x,y-30,x,y+30,[[0,'#fff8e3'],[1,'#bdb39a']]));for(let j=0;j<95;j++){let a=rand(i*103+j),b=rand(i*137+j+500);g.save();g.translate(x-38+a*76,y-20+b*43);g.rotate((a-.5)*2);oval(0,0,3.7,1.8,j%3?'#fff9e6':'#d8cdb3');g.restore()}if(f.wasabi)oval(x,y-14,17,6,'#77974b');let t=f.top;if(t){let colors={tuna:['#c95b64','#7e2438'],salmon:['#ffaf79','#d46a40'],ebi:['#fff3de','#d88b70'],egg:['#f4db77','#c69b38'],squid:['#fff8e9','#c4c1b7'],cucumber:['#8ca650','#3f6732'],ikura:['#ed8b3b','#a63e1b']};let c=colors[t];if(t==='ikura'){round(x-43,y-31,86,57,17,'#23372d');for(let j=0;j<32;j++){let a=rand(j+i*41),b=rand(j+700+i*23);oval(x-32+a*64,y-24+b*28,5,5,'#b94319');oval(x-33+a*64,y-26+b*28,3,2,'#ffad57')}}else{round(x-48,y-35,96,43,13,grad(x,y-35,x,y+9,[[0,c[0]],[1,c[1]]]));g.save();g.beginPath();g.roundRect(x-48,y-35,96,43,13);g.clip();for(let j=0;j<7;j++){g.strokeStyle=t==='salmon'?'#ffe3b9c9':t==='ebi'?'#c65a49a0':t==='squid'?'#b5aaa65c':t==='tuna'?'#f4a3a04d':'#ffffff25';g.lineWidth=t==='salmon'?3:1.5;g.beginPath();g.moveTo(x-60+j*17,y-40);g.bezierCurveTo(x-44+j*17,y-18,x-53+j*17,y-8,x-27+j*17,y+13);g.stroke()}g.restore()}}if(f.nori||t==='egg'){round(x-9,y-35,18,64,3,'#26372d');g.fillStyle='#71816a55';g.fillRect(x-6,y-32,2,58)}}function draw(){g.fillStyle=grad(0,0,600,420,[[0,'#6c4830'],[1,'#302019']]);g.fillRect(0,0,600,420);g.fillStyle='#1c1511';g.fillRect(17,34,566,358);round(22,25,556,353,14,grad(0,25,0,378,[[0,'#e0ba83'],[.16,'#f2d4a0'],[1,'#af7c45']]));round(37,40,526,323,8,'#d8b27c');for(let j=0;j<130;j++){let y=43+j*2.4;g.strokeStyle=j%3?'#8f5c3020':'#fff1bf2d';g.lineWidth=.8;g.beginPath();g.moveTo(39,y);g.bezierCurveTo(190,y+Math.sin(j)*3,390,y+Math.cos(j)*4,560,y);g.stroke()}pos.forEach((p,i)=>{if(slots[i])sushi(p.x,p.y,slots[i],i);else{g.strokeStyle='#906b452a';g.setLineDash([4,6]);g.beginPath();g.ellipse(p.x,p.y,49,31,0,0,6.283);g.stroke();g.setLineDash([])}});if(ginger)for(let j=0;j<Math.min(ginger*5,20);j++){let a=rand(j+9),b=rand(j+61);g.save();g.translate(61+a*55,58+b*24);g.rotate(a*6);oval(0,0,11,3,'#eaaab0');g.restore()}if(soy){oval(533,65,22,17,'#eee1c7');oval(533,65,17,12,'#532918')}update()}function update(){if(!shop||!order)return;let req={};order.items.forEach(k=>req[k]=(req[k]||0)+1);let rows=Object.entries(req).map(([k,n])=>[label[k],slots.filter(f=>f?.top===k).length,n]);rows.unshift(['샤리',slots.filter(Boolean).length,order.items.length]);let text=rows.map(([k,n,m])=>'<div class="'+(n===m?'ok':'')+'">'+(n===m?'✓':'□')+' '+k+' '+n+'/'+m+'</div>').join('');if(order.noWasabi)text+='<div class="'+(slots.some(f=>f?.wasabi)?'':'ok')+'">'+(slots.some(f=>f?.wasabi)?'✕':'✓')+' 와사비 제외</div>';$('#check').innerHTML=text}function apply(i){if(locked)return;if(tool==='ginger'){ginger++;draw();fx(500);return}if(tool==='soy'){soy=true;draw();fx(400);return}if(i<0)return;let f=slots[i];if(tool==='rice'){if(!f){slots[i]={};fx(270)}}else if(!f){say('먼저 샤리를 쥐어주세요.');return}else if(tool==='wasabi'){f.wasabi=true;fx(550)}else if(tool==='nori'){f.nori=true;fx(800)}else{f.top=tool;fx(340)}draw()}function point(e){let b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*600/b.width,y=(e.clientY-b.top)*420/b.height;return pos.findIndex(p=>Math.hypot(p.x-x,p.y-y)<62)}cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);press=point(e);apply(press)};cv.onpointermove=e=>{if(press===null)return;let i=point(e);if(i!==press){press=i;apply(i)}};cv.onpointerup=cv.onpointercancel=()=>press=null;document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());$('#tools').innerHTML=tools.map(([k,icon,n])=>'<button data-k="'+k+'"><span>'+icon+'</span>'+n+'</button>').join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{tool=b.dataset.k;document.querySelectorAll('[data-k]').forEach(a=>a.classList.toggle('active',a===b));say(label[tool]+' 선택 · 초밥 위를 터치하거나 드래그하세요.');fx(850)});document.querySelector('[data-k=rice]').classList.add('active');function clear(){slots=Array.from({length:8},()=>null);ginger=0;soy=false;locked=false;$('#serve').disabled=false;draw()}$('#clear').onclick=()=>{if(!locked)clear()};$('#undo').onclick=()=>{if(locked)return;for(let i=7;i>=0;i--)if(slots[i]){slots[i]=null;break}draw()};function guest(n){let c=$('#face').getContext('2d');c.clearRect(0,0,48,56);let shirt=['#577382','#a17b4c','#7b586c','#64794d'][n%4];for(let [x,y,w,h,col] of [[12,7,24,19,'#372823'],[15,15,18,20,'#edbb91'],[10,20,5,6,'#edbb91'],[33,20,5,6,'#edbb91'],[16,21,3,3,'#352820'],[29,21,3,3,'#352820'],[21,29,6,2,'#9f5b4b'],[10,36,28,16,shirt],[18,35,12,5,'#e1cbb0'],[22,40,4,10,'#e1cbb0']]){c.fillStyle=col;c.fillRect(x,y,w,h)}}function next(){order=menus[served%menus.length];guest(served);let el=$('.guest');el.classList.remove('arrive');void el.offsetWidth;el.classList.add('arrive');$('#speech').textContent=order.name+' お願いします！';$('#orderName').textContent=order.items.map(k=>label[k]).join(' · ')+' / ¥'+order.price;bell();draw()}$('#mode').onclick=()=>{if(timer)clearTimeout(timer);shop=!shop;$('#customer').hidden=!shop;$('#mode').textContent=shop?'自由調理 · 자유 조리':'営業開始 · 장사 시작';$('#sales').textContent=shop?'売上 ¥'+sales+' · '+served+'명':'自由調理 · 자유 조리';$('#serve').textContent=shop?'손님에게 전달':'완성';clear();if(shop){speak('いらっしゃいませ！');next()}};function stamp(t){let e=$('#stamp');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}$('#serve').onclick=()=>{if(locked)return;let f=slots.filter(Boolean);if(!f.length||f.some(x=>!x.top)){say('네타를 올려 초밥을 완성해주세요.');return}if(shop){let actual=f.map(x=>x.top).sort().join(','),expected=[...order.items].sort().join(',');if(actual!==expected){say('주문서의 종류와 수량을 확인해주세요.');return}if(order.noWasabi&&f.some(x=>x.wasabi)){say('와사비 제외 주문이에요.');return}sales+=order.price;served++;$('#sales').textContent='売上 ¥'+sales+' · '+served+'명';speak('毎度ありがとうございます！');stamp('毎度あり！');bell();locked=true;$('#serve').disabled=true;timer=setTimeout(()=>{if(shop){clear();next()}},2100)}else{stamp('完成！');bell();locked=true;$('#serve').disabled=true;setTimeout(()=>{if(!shop){locked=false;$('#serve').disabled=false}},2000)}};let ac,master,musicTimer,step=0;function tone(f,t,d,a){if(!ac)return;let o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(a,t+.015);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.01)}function init(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);musicTimer=setInterval(()=>{if(ac.state!=='running')return;let seq=[261.63,329.63,392,440,392,329.63,293.66,329.63,392,440,523.25,440,392,329.63,293.66,261.63];tone(seq[step%16],ac.currentTime,.4,.07);if(step%4===0)tone(130.81,ac.currentTime,.6,.035);step++},310)}ac.resume()}catch{}}function fx(f){if(ac&&ac.state==='running')tone(f,ac.currentTime,.09,.045)}function bell(){if(ac&&ac.state==='running'){tone(1318.5,ac.currentTime,.5,.1);tone(1760,ac.currentTime+.13,.5,.07)}}function speak(s){try{let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.95;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}catch{}}$('#start').onclick=()=>{init();$('#gate').hidden=true;bell()};document.addEventListener('click',init,{capture:true});draw()})();</script></body></html>
